name: Alpha verification
on:
  push:
    branches: [main, "release/alpha-submission-2026"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source and BIM Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Node integration tests
        run: npm test
      - name: Administrator credential and HTTP login tests
        run: npm run test:admin
      - name: AI contract regression tests
        run: npm run test:ai
      - name: Automatic alert tests
        run: npm run test:alerts
      - name: Verify BIM asset checkout
        run: npm run model:verify
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
